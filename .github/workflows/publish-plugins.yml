name: Publish plugins

on:
  push:
    tags:
      - "v*"

env:
  ORCHESTRATOR_REF: simplify-v2

permissions:
  contents: write

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install orchestrator CLI
        run: uv tool install "git+https://github.com/ugudlado/orchestrator.git@${ORCHESTRATOR_REF}"

      # No claude-code.d.ts is available in CI, so the Claude plugin's
      # types/ directory (and the `tsc -p` check against it) is skipped —
      # `orchestrator pack` warns about this and still exits 0. This is
      # expected; the generated plugin works without types/, it just loses
      # the IDE typecheck. See orchestrator_next/pack_export.py.
      - name: Build Claude plugin
        run: orchestrator pack --target claude --out dist/orchestrator-claude config

      - name: Build Codex plugin
        run: orchestrator pack --target codex --out dist/orchestrator-codex config

      - name: Zip plugins for release assets
        run: |
          cd dist
          zip -r orchestrator-claude.zip orchestrator-claude
          zip -r orchestrator-codex.zip orchestrator-codex

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: orchestrator-plugins-${{ github.ref_name }}
          path: |
            dist/orchestrator-claude.zip
            dist/orchestrator-codex.zip
          if-no-files-found: error

      - name: Attach to GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${{ github.ref_name }}" \
            --title "${{ github.ref_name }}" \
            --generate-notes \
            dist/orchestrator-claude.zip \
            dist/orchestrator-codex.zip \
            || gh release upload "${{ github.ref_name }}" \
                 dist/orchestrator-claude.zip \
                 dist/orchestrator-codex.zip \
                 --clobber
