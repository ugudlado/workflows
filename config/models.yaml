# Model routing for this pack.
#
# The engine reads exactly two blocks from this file (model_routes.py):
#
#   models:       tier alias -> route. A route is either a scalar
#                 {model_id, tool} or a LIST, which is a PATH-gated fallback
#                 chain: the first candidate whose `tool` resolves as a
#                 command on PATH wins. A scalar is never PATH-gated — it
#                 dispatches as written and fails at invoke if absent.
#   step_models:  step_id -> tier alias. This is where a step's model lives;
#                 a contract that declares `model:` is rejected (protocol v2
#                 principle 7).
#
# A chain gates on the TOOL NAME itself — `tool: claude` asks whether
# `claude` is on PATH. There is no longer a `tools:` block mapping a tool to
# a binary and an argv template: the engine stopped spawning vendor CLIs, so
# transports, args_template, and acp_args are all dead keys and were removed.
#
# Precedence across files (highest wins): --models-config /
# ORCHESTRATOR_MODELS_CONFIG > this file > ~/.orchestrator/models.yaml >
# bundled defaults. The highest layer naming an alias owns it WHOLESALE —
# there is no field-level or element-wise merging across layers.
#
# Every tier must resolve to a model_id with a pricing.yaml row.
# test_every_routed_tier_has_a_price fails the build otherwise, because an
# unpriced model records no cost at all rather than a wrong one.

# Named tiers (fable/opus/sonnet) exist so step_models can name a model
# directly, alongside the semantic aliases (strong/standard/fast/code) that
# describe a step's role. Both point at real pricing.yaml-backed model ids.
models:
  strong:
    - { model_id: claude-fable-5-1, tool: claude }

  standard:
    - { model_id: claude-sonnet-5, tool: claude }

  fast:
    - { model_id: claude-haiku-4-5, tool: claude }

  code:
    - { model_id: composer-2.5, tool: cursor }
    - { model_id: claude-opus-5, tool: claude }
    # `codex` is deliberately not a rung here. Adding one without first
    # adding its pricing.yaml row would silently record $0 for every codex
    # step. Price it first, then add the rung.

  fable:
    - { model_id: claude-fable-5-1, tool: claude }

  opus:
    - { model_id: claude-opus-5, tool: claude }

  sonnet:
    - { model_id: claude-sonnet-5, tool: claude }

step_models:
  design: strong
  ux-design: strong
  code-review: strong
  explore: standard
  diagnose: standard
  learn: standard
  design-review: standard
  ux-critique: standard
  verify-changes: standard
  human-review: standard
  implement: code
  intake-research: code
  synthesize-findings: code
