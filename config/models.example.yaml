# Example models.yaml — copy and edit, or pass it directly:
#   orchestrator run TICKET --models-config ./models.example.yaml
#
# Only `models:` and `step_models:` are read. See config/models.yaml for the
# full explanation of chains, PATH gating, and layer precedence.

models:
  strong:
    - { model_id: claude-opus-5, tool: claude }

  standard:
    - { model_id: claude-sonnet-5, tool: claude }

  fast:
    - { model_id: claude-haiku-4-5, tool: claude }

  # A list is a fallback chain: the first candidate whose `tool` is on PATH
  # wins, so a host without cursor-agent falls through to claude.
  code:
    - { model_id: composer-2.5, tool: cursor }
    - { model_id: claude-sonnet-5, tool: claude }

step_models:
  design: strong
  ux-design: strong
  code-review: strong
  explore: standard
  diagnose: standard
  learn: standard
  design-review: standard
  ux-critique: standard
  verify-changes: standard
  human-review: standard
  implement: code
  intake-research: code
  synthesize-findings: code
