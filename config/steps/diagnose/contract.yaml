id: diagnose
version: 6
kind: judgment
prompt: SKILL.md
max_turns: 30
tools: [fs.read, fs.write, fs.list, shell.run]
side_effects: []
in:
  ticket: { artifact: ticket-context.md, optional: true }
out:
  discovery: { artifact: discovery.md }
  fix_scope: { type: enum, values: [standard, hotfix], optional: true }
