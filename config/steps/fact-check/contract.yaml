id: fact-check
version: 1
kind: judgment
prompt: SKILL.md
max_turns: 30
tools: [fs.read, fs.write, fs.list, shell.run]
side_effects: []
in:
  findings: { artifact: findings.md }
  sources: { artifact: sources.md }
out:
  findings: { artifact: findings.md }
  verdict: { type: enum, values: [pass, needs_work], fail_on: [needs_work] }
