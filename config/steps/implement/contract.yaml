id: implement
version: 4
kind: judgment
prompt: SKILL.md
max_turns: 120
tools: [fs.read, fs.write, fs.list, shell.run, shell.test, git.status, git.diff, git.commit]
side_effects: [write:git]
in:
  design: { artifact: design.md, optional: true }
  tasks: { artifact: tasks.yaml, optional: true }
  discovery: { artifact: discovery.md, optional: true }
  ticket: { artifact: ticket-context.md, optional: true }
  triage: { artifact: triage.md, optional: true }
out:
  tasks: { artifact: tasks.yaml }
  # await_input: an environment blocker a human must clear (see SKILL.md); omit otherwise.
  outcome: { type: enum, values: [implemented, await_input], optional: true }
