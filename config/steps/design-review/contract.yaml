id: design-review
version: 3
kind: judgment
prompt: SKILL.md
max_turns: 25
tools: [fs.read, fs.write, shell.run]
side_effects: []
in:
  design: { artifact: design.md }
  tasks: { artifact: tasks.yaml }
out:
  design: { artifact: design.md }
  verdict: { type: enum, values: [pass, needs_work], fail_on: [needs_work] }
