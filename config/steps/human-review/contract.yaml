id: human-review
version: 2
kind: judgment
prompt: SKILL.md
max_turns: 20
tools: [fs.read, fs.write, fs.list]
side_effects: []
in:
  code_review: { artifact: code-review.md, optional: true }
  tasks: { artifact: tasks.yaml, optional: true }
out:
  tasks: { artifact: tasks.yaml, optional: true }
  decision: { type: enum, values: [approved, rework, await_input] }
