name: dev
version: 1
inputs:
  ticket: { type: string }
# One workflow for features, bugfixes, hotfixes and quick changes. Paths:
#   feature:      triage → explore → ux-design → (routes to) design → …
#   standard fix: triage → (routes to) diagnose → design → …
#   hotfix:       triage → diagnose → (routes to) hotfix-signoff → ux-critique → implement → …
#   quick:        triage → (routes to) quick-signoff → ux-critique → implement → …
# Learning is not part of this workflow: the nightly `learn` workflow reads
# finished runs (see learn.yaml and DRIVER.md).
steps:
  - check-rerun # halt if this slug's run already finished (workflow's own decision)
  - create-worktree # creates worktree + branch; writes worktree_path+branch to state
  - load-ticket-context # judgment: ticket fetch or free-text brief → ticket-context.md (+ ticket.json)
  # Fixes jump to diagnose; quick changes (small, well-specified, low risk)
  # skip investigation and design for a person's signoff; features fall
  # through to explore.
  - id: triage
    routes:
      - { when: { change_type: fix }, goto: diagnose }
      - { when: { change_type: quick }, goto: quick-signoff }
  - explore
  # Features skip diagnose and rejoin at design.
  - id: ux-design
    routes:
      - { goto: design }
  # Standard fixes fall through to design; a small urgent hotfix skips design
  # and design-review but still waits for a person at hotfix-signoff.
  - id: diagnose
    routes:
      - { when: { fix_scope: hotfix }, goto: hotfix-signoff }
  - design
  - id: design-review
    on_failure: design
  # Signoff before anything writes outside the run. Engine side is Phase 3.1.
  # Skips the hotfix gate below by jumping straight to ux-critique.
  - gate: design-signoff
    show: [design, tasks]
    approve_as: impl_token
    routes:
      - { goto: ux-critique }
  # Quick path: a person approves the triage call (scope + why it is small)
  # before code is written. Placed after design-signoff and before
  # hotfix-signoff: design-signoff routes past it, and hotfix-signoff falls
  # through to ux-critique, so neither path can land here by accident.
  - gate: quick-signoff
    show: [triage]
    approve_as: impl_token
    routes:
      - { goto: ux-critique }
  # Hotfix path: a person still approves before code is written. Shows the
  # diagnosis only, since a hotfix has no design.
  - { gate: hotfix-signoff, show: [discovery], approve_as: impl_token }
  # ux-critique self-reports verdict: skipped when no UI is touched or no ux
  # prototype exists (fix paths), so it needs no routing.
  - id: ux-critique
    on_failure: ux-design
  # A hotfix has no design.md/tasks.yaml (implement works from discovery.md and
  # writes tasks.yaml). A quick change has no design either: implement works
  # from the ticket + triage.md and writes tasks.yaml. A hotfix or quick change
  # whose implement fails escalates into the full design path via
  # on_failure: design (design runs, then design-review and design-signoff).
  - id: implement
    on_failure: design
    requires: impl_token
  - id: code-review
    on_failure: implement
    max_retries: 8
  - id: verify-changes # requirement met on the branch, evidence cited — the gate before human review
    on_failure: implement
  - id: human-review # human feedback after review; may reset_to implement|design|…
    on_failure: implement
    max_retries: 8
  # complete phase — ends in a pull request, not a local merge. The worktree
  # stays for review fixes; the ticket is done when the PR merges, and
  # run artifacts live outside the worktree and never enter the branch.
  - { gate: pr-signoff, show: [design, tasks, code_review, verification], approve_as: merge_token }
  - mark-change-completed
  - id: open-pr # rebase, full verify, push, gh pr create with evidence
    requires: merge_token
  # cleanup — waits for the PR to merge, then tears down. No archive commit:
  # it would land on the merged (dead) branch and vanish with the worktree.
  - { gate: pr-merged, show: [pr], approve_as: cleanup_token }
  - id: remove-worktree
    requires: cleanup_token
  - workflow-report
