name: research
version: 3
inputs:
  ticket: { type: string }
# Research workflow.
#
# CLI: `orchestrator research "<prompt>"` — session-driven via session_cli
# (Redis session state; no durable *_state.yaml). Resume with:
#   orchestrator --resume <session_id> ["optional input"]
#
# Identity: change_id / slug / ticket_id = session_id.
# Artifacts: the workflow owns placement — see intake-research/SKILL.md
#
# intake-research asks via `intake_status: await_input` until topic/audience/depth
# are filled; then synthesize-findings / presentation / workflow-report.
#
# Web search is NOT a fixed Tavily script — synthesize-findings uses whichever
# search/browse tools the routed agent already has (cursor-agent, etc.).
steps:
  - intake-research
  - synthesize-findings
  - presentation
  - workflow-report
