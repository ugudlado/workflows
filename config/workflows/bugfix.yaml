name: bugfix
version: 2
artifacts_root: spec/changes/{slug}
inputs:
  ticket: { type: string }
steps:
  - check-rerun
  - create-worktree
  - load-ticket-context
  - diagnose
  - design
  - id: design-review
    on_failure: design
  # Signoff before anything writes outside the run. Engine side is Phase 3.1.
  - { gate: design-signoff, show: [design, tasks], approve_as: impl_token }
  - ticket-start
  - id: implement
    on_failure: design
    requires: impl_token
  - ticket-review
  - id: code-review
    on_failure: implement
    max_retries: 8
  - ticket-qa
  - learn
  - persist-learnings
  - workflow-report
