name: feature-remote
version: 2
artifacts_root: spec/changes/{slug}
inputs:
  ticket: { type: string }
# feature-remote — feature workflow for remote (buzz) agent execution.
#
# Transport trust (reply signatures, roster identity) is NOT a workflow
# concern — the workflow-step skill's transport tooling rejects unauthentic replies before the
# loop ever sees them. The workflow verifies the WORK: verify-changes checks
# the run branch against the requirement (acceptance criteria, tasks, project
# checks) after implement, and routes back to implement when unmet.
steps:
  - check-rerun # halt if this feature is already archived (workflow's own decision)
  - create-worktree # creates worktree + branch; writes worktree_path+branch to state
  - load-ticket-context # REST fetch ticket body → ticket-context.md (loop stays agnostic)
  - explore
  - ux-design
  - design
  - id: design-review
    on_failure: design
  # Signoff before anything writes outside the run. Engine side is Phase 3.1.
  - { gate: design-signoff, show: [design, tasks], approve_as: impl_token }
  - ticket-start # ticket -> In Progress (implement entry)
  - id: ux-critique
    on_failure: ux-design
  - id: implement
    on_failure: design
    requires: impl_token
  - ticket-review # ticket -> Review
  - id: code-review
    on_failure: implement
    max_retries: 8
  - id: verify-changes # requirement met on the branch, evidence cited — the gate before human review
    on_failure: implement
  - id: human-review # human feedback after review; may reset_to implement|design|…
    on_failure: implement
    max_retries: 8
  - ticket-qa # ticket -> Verify
  - learn
  - persist-learnings
  # complete phase (merge / teardown) — runs only after human-review completes
  - { gate: merge-signoff, show: [design, tasks, code_review], approve_as: merge_token }
  - mark-change-completed
  - id: archive-completed-change
    requires: merge_token
  - id: merge-to-main
    requires: merge_token
  - id: remove-worktree
    requires: merge_token
  - id: ticket-done
    requires: merge_token
  - workflow-report
