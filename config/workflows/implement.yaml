name: implement
version: 2
artifacts_root: spec/changes/{slug}
inputs:
  ticket: { type: string }
steps:
  - check-rerun
  - create-worktree
  - load-ticket-context
  # No design phase here — the ticket itself is the signoff surface.
  # Engine side is Phase 3.1.
  - { gate: implement-signoff, show: [ticket], approve_as: impl_token }
  - ticket-start
  - id: implement
    on_failure: implement
    requires: impl_token
  - ticket-review
  - id: code-review
    on_failure: implement
    max_retries: 8
  - ticket-qa
  - learn
  - id: persist-learnings
    requires: impl_token
  - workflow-report
