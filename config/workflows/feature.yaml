name: feature
version: 7
inputs:
  ticket: { type: string }
steps:
  - check-rerun # halt if this slug's run already finished (workflow's own decision)
  - create-worktree # creates worktree + branch; writes worktree_path+branch to state
  - load-ticket-context # judgment: ticket fetch or free-text brief → ticket-context.md (+ ticket.json)
  - explore
  - ux-design
  - design
  - id: design-review
    on_failure: design
  # Signoff before anything writes outside the run. Engine side is Phase 3.1.
  - { gate: design-signoff, show: [design, tasks], approve_as: impl_token }
  - id: ux-critique
    on_failure: ux-design
  - id: implement
    on_failure: design
    requires: impl_token
  - id: code-review
    on_failure: implement
    max_retries: 8
  - id: verify-changes # requirement met on the branch, evidence cited — the gate before human review
    on_failure: implement
  - id: human-review # human feedback after review; may reset_to implement|design|…
    on_failure: implement
    max_retries: 8
  # complete phase — ends in a pull request, not a local merge. The worktree
  # stays for review fixes; the ticket is done when the PR merges, and
  # run artifacts live outside the worktree and never enter the branch.
  - { gate: pr-signoff, show: [design, tasks, code_review, verification], approve_as: merge_token }
  - mark-change-completed
  - id: fetch-base # fetch origin's default branch with the pack's token (open-pr has no network)
    requires: merge_token
  - id: open-pr # rebase, full verify, write the PR title and body
    requires: merge_token
  - id: push-pr # push the branch and open the PR with the pack's token; problems become questions
    requires: merge_token
  # cleanup — waits for the PR to merge, then tears down. No archive commit:
  # it would land on the merged (dead) branch and vanish with the worktree.
  - { gate: pr-merged, show: [pr], approve_as: cleanup_token }
  - id: remove-worktree
    requires: cleanup_token
  - workflow-report
