name: patch
version: 2
artifacts_root: spec/changes/{slug}
inputs:
  ticket: { type: string }
# Wiring fix (protocol v2): patch previously listed `design`, but patch has no
# explore/diagnose step, so design's `in.discovery` had no producer and the
# design charter fails hard on a missing discovery.md. The patch path is
# ticket -> implement directly; implement/SKILL.md already documents the
# "design.md and tasks.yaml both absent (patch schema)" branch that derives
# work from ticket-context.md.
steps:
  - check-rerun
  - create-worktree
  - load-ticket-context
  # The ticket is the signoff surface on the patch path. Engine side is Phase 3.1.
  - { gate: patch-signoff, show: [ticket], approve_as: impl_token }
  - ticket-start
  - id: implement
    on_failure: implement
    requires: impl_token
  - ticket-review
  - id: code-review
    on_failure: implement
    max_retries: 8
  - ticket-qa
  - learn
  - id: persist-learnings
    requires: impl_token
  - workflow-report
